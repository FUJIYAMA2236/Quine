function tableMove(r, c, extend) { tableActivate(T.wrap, r, c, { extend }); }
function tableTab(back) {
  const [nr, nc] = dims();
  let r = T.r, c = T.c + (back ? -1 : 1);
  if (c >= nc) { c = 0; r++; }
  if (c < 0) { c = nc - 1; r--; }
  if (r < 0) { r = 0; c = 0; }
  if (r >= nr) { tableOp('insertRow', nr); r = nr; c = 0; }
  tableMove(r, c, false);
}

function tableKey(e) {
  if (!T.wrap) {
    const td = e.target.closest && e.target.closest('td');
    if (!td) return;
    tableActivate(td.closest('.qtable'), td.parentNode.rowIndex, td.cellIndex);
  }
  const mod = e.ctrlKey || e.metaKey;
  const k = e.key;
  const [nr, nc] = dims();
  if (T.mode === 'edit') {
    if (e.isComposing || e.keyCode === 229) return;
    if (k === 'Enter' && e.altKey) { e.preventDefault(); document.execCommand('insertLineBreak'); return; }
    if (k === 'Enter') { e.preventDefault(); tableCommit(); tableMove(T.r + (e.shiftKey ? -1 : 1), T.c, false); return; }
    if (k === 'Tab') { e.preventDefault(); tableCommit(); tableTab(e.shiftKey); return; }
    if (k === 'Escape') { e.preventDefault(); e.stopPropagation(); tableCancelEdit(); return; }
    if (T.kind === 'type' && /^Arrow/.test(k) && !e.shiftKey && !mod) {
      e.preventDefault(); tableCommit();
      const dr = k === 'ArrowUp' ? -1 : k === 'ArrowDown' ? 1 : 0, dc = k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0;
      tableMove(T.r + dr, T.c + dc, false); return;
    }
    if (mod && /^[iu]$/i.test(k)) { e.preventDefault(); return; }
    return;
  }
  // ready
  if (e.isComposing || e.keyCode === 229) { tableStartEdit('type', true); return; }
  if (/^Arrow/.test(k)) {
    e.preventDefault();
    const dr = k === 'ArrowUp' ? -1 : k === 'ArrowDown' ? 1 : 0, dc = k === 'ArrowLeft' ? -1 : k === 'ArrowRight' ? 1 : 0;
    if (!e.shiftKey && !mod) {
      if (dr === -1 && T.r === 0) { exitTable('before'); return; }
      if (dr === 1 && T.r === nr - 1) { exitTable('after'); return; }
    }
    let r = T.r + dr, c = T.c + dc;
    if (mod) { r = dr < 0 ? 0 : dr > 0 ? nr - 1 : T.r; c = dc < 0 ? 0 : dc > 0 ? nc - 1 : T.c; }
    tableMove(r, c, e.shiftKey);
    return;
  }
  if (k === 'Tab') { e.preventDefault(); tableTab(e.shiftKey); return; }
  if (k === 'Enter') { e.preventDefault(); tableMove(T.r + (e.shiftKey ? -1 : 1), T.c, false); return; }
  if (k === 'F2') { e.preventDefault(); tableStartEdit('f2', false); return; }
  if (k === 'Escape') { e.preventDefault(); e.stopPropagation(); exitTable('after'); return; }
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); edit(() => rangeCells().forEach((td) => { td.innerHTML = ''; })); showTableUI(T.wrap); return; }
  if (mod) {
    const kk = k.toLowerCase();
    if (kk === 'a') { e.preventDefault(); T.ar = 0; T.ac = 0; tableMove(nr - 1, nc - 1, true); return; }
    if (kk === 'b') { e.preventDefault(); tableFormat('bold'); return; }
    if (kk === 'c' || kk === 'x' || kk === 'v') return;
    e.preventDefault();
    return;
  }
  if (k.length === 1 && !e.altKey) { tableStartEdit('type', true); return; }
  if (!['Shift', 'Control', 'Alt', 'Meta', 'CapsLock'].includes(k)) e.preventDefault();
}

// ---------- clipboard ----------
function tableCopy(e, cut) {
  if (!tableReadyActive()) return;
  e.preventDefault();
  const b = rangeBox(), rows = [];
  for (let r = b.r0; r <= b.r1; r++) { const row = []; for (let c = b.c0; c <= b.c1; c++) row.push(cellAt(T.wrap, r, c)); rows.push(row); }
  e.clipboardData.setData('text/plain', toTSV(rows));
  e.clipboardData.setData('text/html', '<table>' + rows.map((r) => '<tr>' + r.map((td) => `<td>${td.innerHTML}</td>`).join('') + '</tr>').join('') + '</table>');
  if (cut) { edit(() => rangeCells().forEach((td) => { td.innerHTML = ''; })); showTableUI(T.wrap); }
}
function tablePaste(e) {
  if (!T.wrap) return;
  const cd = e.clipboardData;
  const text = cd.getData('text/plain') || '', html = cd.getData('text/html') || '';
  e.preventDefault();
  let grid = null;
  const trimmed = text.replace(/\r?\n$/, '');
  if (trimmed.includes('\t') || trimmed.includes('\n')) grid = parseTSV(text).map((r) => r.map(textToCellHTML));
  else if (/<table/i.test(html)) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const t = doc.querySelector('table');
    grid = Array.from(t.rows).map((tr) => Array.from(tr.cells).map((td) => sanitizeHTML(td.innerHTML, { cell: true }).trim()));
  }
  if (T.mode === 'edit' && (!grid || (grid.length === 1 && grid[0].length === 1))) {
    const clean = html && !grid ? sanitizeHTML(html, { cell: true }) : textToCellHTML(trimmed);
    document.execCommand('insertHTML', false, clean);
    return;
  }
  if (!grid) grid = [[html ? sanitizeHTML(html, { cell: true }).trim() : textToCellHTML(trimmed)]];
  tableCommit();
  const w = T.wrap, b = rangeBox();
  const r0 = b.r0, c0 = b.c0;
  const gw = Math.max(...grid.map((r) => r.length));
  edit(() => {
    let [nr, nc] = dims(w);
    while (nr < r0 + grid.length) { addRow(w, nr); nr++; }
    while (nc < c0 + gw) { addCol(w, nc); nc++; }
    grid.forEach((row, i) => row.forEach((v, j) => { cellAt(w, r0 + i, c0 + j).innerHTML = v; }));
    fixTableWidth(w);
  });
  T.ar = r0; T.ac = c0;
  tableActivate(w, r0 + grid.length - 1, c0 + gw - 1, { extend: true });
}

// ---------- cell formatting ----------
function cellIsBold(td) {
  const t = td.textContent.replace(/\s/g, '');
  if (!t) return true;
  return $$('strong,b', td).map((x) => x.textContent).join('').replace(/\s/g, '') === t;
}
function tableCellsAre(kind) { return kind === 'bold' && rangeCells().every(cellIsBold) && rangeCells().some((td) => td.textContent.trim()); }
function tableFormat(kind) {
  if (kind !== 'bold' || !T.wrap) return;
  const cells = rangeCells();
  const allBold = tableCellsAre('bold');
  edit(() => {
    for (const td of cells) {
      $$('strong,b', td).forEach(unwrap);
      if (!allBold && td.textContent.trim()) {
        const s = document.createElement('strong');
        while (td.firstChild) s.appendChild(td.firstChild);
        td.appendChild(s);
      }
    }
  });
  tableActivate(T.wrap, T.r, T.c, { extend: true });
}
function tableColor(c) {
  if (!T.wrap) return;
  edit(() => {
    for (const td of rangeCells()) {
      $$('span', td).forEach((sp) => { sp.style.color = ''; if (!sp.getAttribute('style')) unwrap(sp); });
      if (c && td.textContent.trim()) {
        const sp = document.createElement('span'); sp.style.color = c;
        while (td.firstChild) sp.appendChild(td.firstChild);
        td.appendChild(sp);
      }
    }
  });
  tableActivate(T.wrap, T.r, T.c, { extend: true });
}

// ---------- structure ----------
function addRow(w, idx) {
  const t = tbl(w), nc = dims(w)[1];
  const tr = t.tBodies[0].insertRow(idx);
  for (let c = 0; c < nc; c++) tr.insertCell();
}
function addCol(w, idx) {
  const t = tbl(w);
  const cg = t.querySelector('colgroup');
  const ref = cg.children[Math.min(idx, cg.children.length - 1)];
  const col = document.createElement('col');
  col.style.width = (ref ? parseInt(ref.style.width, 10) || DEF_COL_W : DEF_COL_W) + 'px';
  cg.insertBefore(col, cg.children[idx] || null);
  for (const tr of t.rows) tr.insertCell(idx);
  fixTableWidth(w);
}
function moveChild(parent, list, from, to) {
  const [el] = list.splice(from, 1);
  list.splice(to, 0, el);
  list.forEach((n) => parent.appendChild(n));
}
function tableOp(op, a, b, w = T.wrap) {
  if (!w) return;
  const [nr, nc] = dims(w);
  const t = tbl(w);
  if ((op === 'deleteRow' && nr <= 1) || (op === 'deleteCol' && nc <= 1)) {
    toast('最後の1行・1列は削除できません。表ごと消すときは表メニューから削除してください', 'warn', 4500);
    return;
  }
  const active = T.wrap === w;
  edit(() => {
    if (op === 'insertRow') addRow(w, a);
    else if (op === 'insertCol') addCol(w, a);
    else if (op === 'deleteRow') t.rows[a].remove();
    else if (op === 'deleteCol') { t.querySelector('colgroup').children[a].remove(); for (const tr of t.rows) tr.cells[a].remove(); }
    else if (op === 'moveRow') moveChild(t.tBodies[0], Array.from(t.rows), a, b);
    else if (op === 'moveCol') {
      const cg = t.querySelector('colgroup');
      moveChild(cg, Array.from(cg.children), a, b);
      for (const tr of t.rows) moveChild(tr, Array.from(tr.cells), a, b);
    }
    fixTableWidth(w);
  });
  if (active) {
    T.wrap = w;
    const [r2, c2] = dims(w);
    let r = T.r, c = T.c;
    if (op === 'insertRow' && a <= r) r++;
    if (op === 'insertCol' && a <= c) c++;
    if (op === 'moveRow') r = b; if (op === 'moveCol') c = b;
    $$('td[contenteditable]', w).forEach((td) => { td.removeAttribute('contenteditable'); td.classList.remove('qact', 'qedit'); });
    tableActivate(w, clamp(r, 0, r2 - 1), clamp(c, 0, c2 - 1));
  } else showTableUI(w);
}
function tableToggleHeader(w) {
  edit(() => { if (w.dataset.header === '1') delete w.dataset.header; else w.dataset.header = '1'; });
  showTableUI(w);
}
function tableDelete(w) {
  if (T.wrap === w) tableDeactivate();
  edit(() => {
    const next = w.nextElementSibling;
    w.remove();
    if (next) setCaret(next, 0);
  });
  toast('表を削除しました（Ctrl+Z で元に戻せます）');
}

// ---------- overlay UI (handles, +, resize grips) ----------
// 取っ手類は本文（編集領域）の外にある重ね合わせ層に描く。
// 編集領域の中をいじると日本語入力（IME）の変換やカーソル位置が乱れるため。
let layer = null;
let layerObs = null;
function tableLayer() {
  if (layer && layer.isConnected) return layer;
  layer = document.createElement('div');
  layer.className = 'qt-layer';
  $('.doc').appendChild(layer);
  layer.addEventListener('mousedown', tableUIDown);
  layer.addEventListener('mouseleave', (e) => {
    if (layer._w && layer._w !== T.wrap && !(e.relatedTarget && layer._w.contains(e.relatedTarget))) hideTableUI(layer._w);
  });
  layerObs = new ResizeObserver(() => {
    if (!layer || !layer._w) return;
    if (S.composing) { layer._pending = true; return; } // 変換中は描き直さない（終わってからまとめて）
    showTableUI(layer._w);
  });
  return layer;
}
function hideTableUI(w) {
  if (!layer || (w && layer._w !== w)) return;
  layer._w = null;
  layer.innerHTML = '';
  layer.style.display = 'none';
  if (layerObs) layerObs.disconnect();
}
function showTableUI(w) {
  if (!S.edit || !w || !w.isConnected) return;
  const t = tbl(w);
  if (!t || !t.rows[0]) return;
  const ui = tableLayer();
  if (ui._w !== w) {
    layerObs.disconnect();
    layerObs.observe(w); layerObs.observe(t);
  }
  ui._w = w;
  const dr = $('.doc').getBoundingClientRect(), wr = w.getBoundingClientRect(), tr = t.getBoundingClientRect();
  Object.assign(ui.style, { display: 'block', left: wr.left - dr.left + 'px', top: wr.top - dr.top + 'px', width: wr.width + 'px', height: wr.height + 'px' });
  // 座標はすべて「表ブロックの左上」からの見た目の位置（横スクロールも反映される）
  const ox = tr.left - wr.left, oy = tr.top - wr.top, tw = tr.width, th = tr.height;
  const first = t.rows[0];
  let s = '<div class="qt-corner" data-ui="corner" title="表のメニュー"></div>';
  const xs = [];
  for (let c = 0; c < first.cells.length; c++) xs.push(first.cells[c].getBoundingClientRect().left - wr.left);
  xs.push(ox + tw);
  for (let c = 0; c < first.cells.length; c++) {
    const on = T.wrap === w && c >= rangeBox().c0 && c <= rangeBox().c1 && rangeBox().r0 === 0 && rangeBox().r1 === t.rows.length - 1;
    s += `<div class="qt-colh ${on ? 'on' : ''}" data-ui="col" data-i="${c}" style="left:${xs[c] + 3}px;width:${xs[c + 1] - xs[c] - 6}px" title="クリック：列のメニュー／ドラッグ：列の移動"></div>`;
    s += `<div class="qt-grip" data-ui="grip" data-i="${c}" style="left:${xs[c + 1]}px;top:${oy}px;height:${th}px" title="ドラッグで列幅を変更"></div>`;
  }
  for (let c = 0; c <= first.cells.length; c++) {
    s += `<div class="qt-addzone" data-ui="addcol" data-i="${c}" style="left:${xs[c] - 8}px;top:0;width:16px;height:${oy}px" title="列を挿入"><div class="qt-line" style="left:7px;top:${oy}px;width:2px;height:${th}px"></div><div class="qt-add" style="left:8px;top:10px"></div></div>`;
  }
  const ys = [];
  for (let r = 0; r < t.rows.length; r++) ys.push(t.rows[r].getBoundingClientRect().top - wr.top);
  ys.push(oy + th);
  for (let r = 0; r < t.rows.length; r++) {
    s += `<div class="qt-rowh" data-ui="row" data-i="${r}" style="top:${ys[r] + 3}px;height:${ys[r + 1] - ys[r] - 6}px" title="クリック：行のメニュー／ドラッグ：行の移動"></div>`;
  }
  for (let r = 0; r <= t.rows.length; r++) {
    s += `<div class="qt-addzone" data-ui="addrow" data-i="${r}" style="top:${ys[r] - 8}px;left:0;height:16px;width:${ox}px" title="行を挿入"><div class="qt-line" style="top:7px;left:${ox}px;height:2px;width:${tw}px"></div><div class="qt-add" style="top:8px;left:10px"></div></div>`;
  }
  ui.innerHTML = s;
  ui._xs = xs; ui._ys = ys;
}

function selectLine(w, kind, i) {
  const [nr, nc] = dims(w);
  if (T.wrap !== w) tableActivate(w, 0, 0);
  if (kind === 'col') { T.ar = 0; T.ac = i; tableActivate(w, nr - 1, i, { extend: true }); }
  else { T.ar = i; T.ac = 0; tableActivate(w, i, nc - 1, { extend: true }); }
}

function lineMenu(w, kind, i) {
  return kind === 'col' ? [
    { label: '左に列を挿入', icon: 'plus', onClick: () => tableOp('insertCol', i, 0, w) },
    { label: '右に列を挿入', icon: 'plus', onClick: () => tableOp('insertCol', i + 1, 0, w) },

  ] : [
    { label: '上に行を挿入', icon: 'plus', onClick: () => tableOp('insertRow', i, 0, w) },
    { label: '下に行を挿入', icon: 'plus', onClick: () => tableOp('insertRow', i + 1, 0, w) },
    '-',
    { label: 'この行を削除', icon: 'trash', danger: true, onClick: () => tableOp('deleteRow', i, 0, w) },

function tableUIDown(e) {

  if (kind === 'corner') {

      { header: true, label: '表' },
      { label: '1行目を見出しにする', icon: 'rows', check: w.dataset.header === '1', onClick: () => tableToggleHeader(w) },
      { label: 'すべてのセルを選択', icon: 'table', onClick: () => { const [nr, nc] = dims(w); tableActivate(w, 0, 0); T.ar = 0; T.ac = 0; tableActivate(w, nr - 1, nc - 1, { extend: true }); } },
      '-',
      { label: '表を削除', icon: 'trash', danger: true, onClick: () => tableDelete(w) },

  }

    };

    return;

    const startX = e.clientX, startY = e.clientY;
    let dragging = false, target = i, ind = null;
    const marks = kind === 'col' ? ui._xs : ui._ys;
    const t = tbl(w);
    const move = (ev) => {
      if (!dragging && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 5) return;
      dragging = true;
      const wr = w.getBoundingClientRect();
      const tr = t.getBoundingClientRect();
      const pos = kind === 'col' ? ev.clientX - wr.left : ev.clientY - wr.top;
      let best = 0;
      for (let k = 0; k < marks.length; k++) if (Math.abs(marks[k] - pos) < Math.abs(marks[best] - pos)) best = k;
      target = best;
      if (!ind) { ind = document.createElement('div'); ind.className = 'qt-drop'; ui.appendChild(ind); }
      if (kind === 'col') Object.assign(ind.style, { left: marks[best] - 1.5 + 'px', top: tr.top - wr.top + 'px', width: '3px', height: tr.height + 'px' });
      else Object.assign(ind.style, { top: marks[best] - 1.5 + 'px', left: tr.left - wr.left + 'px', height: '3px', width: tr.width + 'px' });
    };
    const up = () => {
      removeEventListener('mousemove', move); removeEventListener('mouseup', up);
      if (ind) ind.remove();
      if (!dragging) {
        selectLine(w, kind, i);
        const anchor = layer.querySelector(`.qt-${kind}h[data-i="${i}"]`) || el;
        openMenu(lineMenu(w, kind, i), anchor);
        return;
      }
      let to = target > i ? target - 1 : target;
      if (to !== i) tableOp(kind === 'col' ? 'moveCol' : 'moveRow', i, to, w);
    };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  }
}

// ---- image.js ----
// ---------- images ----------
const MAX_SIDE = 1280;
const JPEG_Q = 0.85;
const imgUrlCache = new Map();
const BROKEN_IMG = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="120" viewBox="0 0 240 120"><rect width="240" height="120" rx="10" fill="#f1eee8"/><text x="120" y="66" font-family="sans-serif" font-size="13" fill="#9a9da4" text-anchor="middle">画像が見つかりません</text></svg>');

function imgURL(hash, map = IMG) {
  if (imgUrlCache.has(hash)) return imgUrlCache.get(hash);
  const im = map && map[hash];
  if (!im) return BROKEN_IMG;
  try {
    const bin = atob(im.data);
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: im.mime }));
    imgUrlCache.set(hash, url);
    return url;
  } catch (e) { return BROKEN_IMG; }
}

function storeImage(dataURL, w, h) {
  const i = dataURL.indexOf(',');
  const mime = dataURL.slice(5, dataURL.indexOf(';'));
  const data = dataURL.slice(i + 1);
  const hash = hashStr(data);
  if (!IMG[hash]) IMG[hash] = { mime, data, w, h };
  return hash;
}

function hasAlpha(ctx, w, h) {
  const d = ctx.getImageData(0, 0, w, h).data;
  for (let i = 3; i < d.length; i += 16) if (d[i] < 250) return true;
  return false;
}

async function processImageFile(file) {
  const src = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
    let w = img.naturalWidth, h = img.naturalHeight;
    const s = Math.min(1, MAX_SIDE / Math.max(w, h));
    w = Math.max(1, Math.round(w * s)); h = Math.max(1, Math.round(h * s));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    const isJpeg = /jpe?g/i.test(file.type);
    if (isJpeg) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
    ctx.drawImage(img, 0, 0, w, h);
    let url;
    if (isJpeg) url = cv.toDataURL('image/jpeg', JPEG_Q);
    else {
      const png = cv.toDataURL('image/png');
      if (hasAlpha(ctx, w, h)) url = png;
      else {
        const jpg = cv.toDataURL('image/jpeg', JPEG_Q);
        url = jpg.length < png.length * 0.9 ? jpg : png; // スクリーンショットはPNGの方が小さいことが多い
      }
    }
    return storeImage(url, w, h);
  } finally { URL.revokeObjectURL(src); }
}

async function insertImages(files, range) {
  if (!S.edit || !files.length) return;
  const many = files.length > 1 || files[0].size > 1.5e6;

  const hashes = [];
  for (const f of files) {
    try { hashes.push(await processImageFile(f)); } catch (e) { toast(`「${f.name || '画像'}」を読み込めませんでした`, 'warn'); }
  }
  if (!hashes.length) return;
  ed.focus();
  if (range) { const s = getSelection(); s.removeAllRanges(); s.addRange(range); }
  else if (!selRange()) restoreRange();
  if (!selRange()) { const last = ed.lastElementChild; setCaret(last, last.childNodes.length); }
  edit(() => document.execCommand('insertHTML', false, hashes.map((x) => `<img data-img="${x}" alt="">`).join('')));

}

// ---- search.js ----
// ---------- search ----------
// 大文字小文字・全角半角（NFKC）を区別せず、カタカナはひらがなとして比べる
function normChar(ch) {
  return ch.normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g, (m) => String.fromCharCode(m.charCodeAt(0) - 0x60));
}
function norm(s) { let o = ''; for (const ch of String(s || '')) o += normChar(ch); return o; }
function normMap(s) {
  let n = ''; const map = []; let i = 0;
  for (const ch of s) { const x = normChar(ch); for (let k = 0; k < x.length; k++) map.push(i); n += x; i += ch.length; }
  map.push(i);
  return { n, map };
}
function findRanges(str, terms) {
  const { n, map } = normMap(str);
  const out = [];
  for (const t of terms) {
    let p = n.indexOf(t);
    while (p >= 0) { out.push([map[p], map[p + t.length]]); p = n.indexOf(t, p + t.length); }
  }
  out.sort((a, b) => a[0] - b[0]);
  const merged = [];
  for (const r of out) { const l = merged[merged.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); }
  return merged;
}
function highlightText(str, terms) {
  const rs = findRanges(str, terms);
  let o = '', last = 0;
  for (const [a, b] of rs) { o += esc(str.slice(last, a)) + '<mark>' + esc(str.slice(a, b)) + '</mark>'; last = b; }
  return o + esc(str.slice(last));
}

const textCache = new Map();
function plainText(a) {
  const c = textCache.get(a.id);
  if (c && c.body === a.body) return c;
  const html = (a.body || '').replace(/<br\s*\/?>/gi, ' ').replace(/<\/(p|h[1-6]|li|td|pre|blockquote|div|tr)>/gi, ' $&');
  const d = new DOMParser().parseFromString(html, 'text/html');
  const text = d.body.textContent.replace(/​/g, '').replace(/\s+/g, ' ').trim();
  const v = { body: a.body, text, n: norm(text) };
  textCache.set(a.id, v);
  return v;
}

let results = [];
let kbIndex = -1;
function runSearch(q) {
  commitEditor();
  const terms = norm(q).split(/\s+/).filter(Boolean);
  S.search.q = q; S.search.terms = terms;
  S.search.hits = new Set(); S.search.ctx = new Set();
  $('.search').classList.toggle('has-q', !!q);
  results = [];
  if (!terms.length) { closeResults(); renderTree(); applyHighlights(); return; }
  for (const a of A.values()) {
    const nt = norm(a.title);
    const pt = plainText(a);
    if (terms.every((t) => nt.includes(t) || pt.n.includes(t))) {
      S.search.hits.add(a.id);
      results.push({ a, inTitle: terms.some((t) => nt.includes(t)), text: pt.text });
    }
  }
  for (const id of S.search.hits) for (const p of ancestors(id)) if (!S.search.hits.has(p.id)) S.search.ctx.add(p.id);
  results.sort((x, y) => (y.inTitle - x.inTitle) || String(y.a.updatedAt).localeCompare(String(x.a.updatedAt)));
  renderTree();
  renderResults();
  applyHighlights();
}

function snippet(text, terms) {
  const rs = findRanges(text, terms);
  if (!rs.length) return esc(text.slice(0, 90));
  const [a] = rs[0];
  const s = Math.max(0, a - 32);
  const e = Math.min(text.length, a + 70);
  return (s > 0 ? '…' : '') + highlightText(text.slice(s, e), terms) + (e < text.length ? '…' : '');
}

function renderResults() {
  const pop = $('.search-pop');
  const terms = S.search.terms;
  kbIndex = -1;
  if (!results.length) {
    pop.innerHTML = `<div class="sr-empty"><b>見つかりませんでした</b>言葉を減らすか、別の言い方で試してください</div>`;
  } else {
    pop.innerHTML = `<div class="sr-head"><span>${results.length}件の記事</span><span>スペース区切りで絞り込み</span></div>` +
      results.slice(0, 80).map((r) => `<button class="sr-item" data-id="${r.a.id}">
        <div class="sr-title">${ic('doc', 'sm')}<span>${highlightText(r.a.title || '無題の記事', terms)}</span></div>
        ${r.a.parentId ? `<div class="sr-crumb">${esc(crumbText(r.a.id))}</div>` : ''}
        <div class="sr-snip">${snippet(r.text, terms)}</div></button>`).join('');
  }
  pop.classList.add('open');
}
function closeResults() { $('.search-pop').classList.remove('open'); }

function clearSearch() {
  $('#q').value = '';
  runSearch('');
}

// ---- 本文のハイライト（表示上のみ。保存データには入らない） ----
function applyHighlights() {
  const bar = $('.hitbar');
  S.search.marks = [];
  if (!ed) return;
  $$('mark.qhit', ed).forEach(unwrap);
  ed.normalize();
  const terms = S.search.terms;
  if (S.edit || !terms.length || !S.search.hits.has(S.cur)) { bar.classList.remove('on'); return; }
  const tw = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (tw.nextNode()) nodes.push(tw.currentNode);
  for (const t of nodes) {
    const rs = findRanges(t.data, terms);
    for (let i = rs.length - 1; i >= 0; i--) {
      const [a, b] = rs[i];
      const mid = t.splitText(a);
      mid.splitText(b - a);
      const m = document.createElement('mark');
      m.className = 'qhit';
      mid.replaceWith(m);
      m.appendChild(mid);
    }
  }
  S.search.marks = $$('mark.qhit', ed);
  S.search.idx = 0;
  bar.classList.add('on');
  updateHitbar(true);
}
function updateHitbar(scroll) {
  const n = S.search.marks.length;
  const txt = $('.hb-text');
  S.search.marks.forEach((m, i) => m.classList.toggle('cur', i === S.search.idx));
  if (!n) { txt.innerHTML = '本文には一致なし（タイトルに一致）'; return; }
  txt.innerHTML = `<b>${esc(S.search.q)}</b>${S.search.idx + 1} / ${n}`;
  if (scroll) {
    const m = S.search.marks[S.search.idx];
    const c = $('.content');
    const r = m.getBoundingClientRect(), cr = c.getBoundingClientRect();
    if (r.top < cr.top + 80 || r.bottom > cr.bottom - 40) c.scrollTop += r.top - cr.top - cr.height / 3;
  }
}
function hitStep(d) {
  const n = S.search.marks.length;
  if (!n) return;
  S.search.idx = (S.search.idx + d + n) % n;
  updateHitbar(true);
}

function bindSearch() {
  const q = $('#q');
  const run = debounce(() => runSearch(q.value), 220);
  q.addEventListener('input', run);
  q.addEventListener('focus', () => { if (S.search.terms.length) renderResults(); });
  q.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    const items = $$('.sr-item');
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); if (q.value) clearSearch(); else q.blur(); closeResults(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!$('.search-pop').classList.contains('open')) renderResults();
      kbIndex = clamp(kbIndex + (e.key === 'ArrowDown' ? 1 : -1), 0, items.length - 1);
      items.forEach((it, i) => it.classList.toggle('kb', i === kbIndex));
      items[kbIndex] && items[kbIndex].scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      runSearch(q.value);
      const it = $$('.sr-item')[Math.max(0, kbIndex)];
      if (it) { go(it.dataset.id); closeResults(); q.blur(); }
    }
  });
  $('.search-pop').addEventListener('mousedown', (e) => e.preventDefault());
  $('.search-pop').addEventListener('click', (e) => {
    const it = e.target.closest('.sr-item');
    if (!it) return;
    go(it.dataset.id);
    closeResults();
    q.blur();
  });
  q.addEventListener('blur', () => setTimeout(closeResults, 120));
  $('.search-clear').addEventListener('click', (e) => { e.preventDefault(); clearSearch(); q.focus(); });
  $('.hitbar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-hb]');
    if (!b) return;
    if (b.dataset.hb === 'next') hitStep(1);
    else if (b.dataset.hb === 'prev') hitStep(-1);
    else clearSearch();
  });
}

// ---- linker.js ----
// ---------- link suggestions（ほかの記事のタイトル・見出しと同じ言葉をリンク候補にする） ----------
// 方向は2つ：
//   出ていくリンク … 書いた記事の中の言葉 → その言葉がタイトル・見出しになっている記事へ
//   入ってくるリンク … ほかの記事の中の言葉 → 書いた記事（タイトル・見出し）へ
// 1つの記事につき、同じリンク先へは最初の1か所だけを候補にする（すでにリンクがあれば出さない）。

const LINK_SKIP = 'a,h1,h2,h3,pre,code';
const MIN_TERM = 2;

const headingCache = new Map();
function articleHeadings(a) {
  const c = headingCache.get(a.id);
  if (c && c.body === a.body) return c.list;
  const d = new DOMParser().parseFromString(a.body || '', 'text/html');
  const list = $$('h1,h2,h3', d).map((h) => h.textContent.replace(/\s+/g, ' ').trim()).filter((t) => t.length <= 60);
  headingCache.set(a.id, { body: a.body, list });
  return list;
}

// 記事 a を指す言葉の一覧（タイトル → 見出しの順）
function termsOf(a) {
  const out = [];
  const add = (text, kind) => {
    const t = (text || '').trim();
    const n = norm(t);
    if (n.length < MIN_TERM || out.some((x) => x.n === n)) return;
    out.push({ text: t, n, targetId: a.id, kind, ascii: /^[\x20-\x7e]+$/.test(n) });
  };
  add(a.title, 'title');
  for (const h of articleHeadings(a)) add(h, 'heading');
  return out;
}

// root（記事本文のDOM）の中から terms の出現を探す。リンク先ごとに最初の1か所だけ。
function findLinkSpots(root, terms, selfId) {
  const linked = new Set($$('a[href^="#"]', root).map((x) => decodeURIComponent(x.getAttribute('href').slice(1))));
  const usable = terms.filter((t) => t.targetId !== selfId && !linked.has(t.targetId));
  if (!usable.length) return [];
  const hits = [];
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let order = 0;
  while (tw.nextNode()) {
    const node = tw.currentNode;
    if (!node.data.trim() || (node.parentNode.closest && node.parentNode.closest(LINK_SKIP))) continue;
    const { n, map } = normMap(node.data);
    for (const t of usable) {
      let p = n.indexOf(t.n);
      while (p >= 0) {
        const start = map[p], end = map[p + t.n.length];
        const before = node.data[start - 1] || '', after = node.data[end] || '';
        // 英数字だけの言葉は、単語の途中に当たったものを除く（"IT" が "EDIT" に当たらないように）
        if (!t.ascii || (!/[A-Za-z0-9]/.test(before) && !/[A-Za-z0-9]/.test(after))) {
          hits.push({ node, start, end, term: t, order: order * 100000 + start });
          break;
        }
        p = n.indexOf(t.n, p + 1);
      }
    }
    order++;
  }
  // 重なったら長い言葉を優先、同じリンク先は最初の1か所だけ
  hits.sort((x, y) => (y.end - y.start) - (x.end - x.start) || x.order - y.order);
  const chosen = [], taken = new Set();
  for (const h of hits) {
    if (taken.has(h.term.targetId)) continue;
    if (chosen.some((c) => c.node === h.node && h.start < c.end && c.start < h.end)) continue;
    chosen.push(h);
    taken.add(h.term.targetId);
  }
  return chosen.sort((x, y) => x.order - y.order);
}

function snippetOf(node, start, end) {
  const s = node.data;
  const a = Math.max(0, start - 24), b = Math.min(s.length, end + 24);
  return (a > 0 ? '…' : '') + esc(s.slice(a, start)) + '<mark>' + esc(s.slice(start, end)) + '</mark>' + esc(s.slice(end, b)) + (b < s.length ? '…' : '');
}

// ids の記事について、出ていく・入ってくる両方の候補を集める
function collectLinkCandidates(ids) {
  commitEditor();
  const roots = new Map();
  const rootOf = (id) => {
    if (!roots.has(id)) { const d = document.createElement('div'); d.innerHTML = A.get(id).body || ''; roots.set(id, d); }
    return roots.get(id);
  };
  const allTerms = Array.from(A.values()).flatMap(termsOf);
  const cands = [];
  const seen = new Set();
  const push = (dir, hostId, spot) => {
    const key = hostId + '>' + spot.term.targetId;
    if (seen.has(key)) return;
    seen.add(key);
    cands.push({ dir, hostId, targetId: spot.term.targetId, term: spot.term, node: spot.node, start: spot.start, end: spot.end, snippet: snippetOf(spot.node, spot.start, spot.end), on: spot.term.kind === 'title' });
  };
  for (const id of ids) {
    const a = A.get(id);
    if (!a) continue;
    // 出ていく：この記事の中の言葉 → ほかの記事
    for (const spot of findLinkSpots(rootOf(id), allTerms, id)) push('out', id, spot);
    // 入ってくる：ほかの記事の中の言葉 → この記事
    const mine = termsOf(a);
    if (!mine.length) continue;
    for (const b of A.values()) {
      if (b.id === id) continue;
      for (const spot of findLinkSpots(rootOf(b.id), mine, b.id)) push('in', b.id, spot);
    }
  }
  return { cands, roots };
}

function applyLinkCandidates(chosen, roots) {
  S.linking = true;
  try { return applyLinks(chosen, roots); } finally { S.linking = false; }
}
function applyLinks(chosen, roots) {
  const byNode = new Map();
  for (const c of chosen) { if (!byNode.has(c.node)) byNode.set(c.node, []); byNode.get(c.node).push(c); }
  const hosts = new Set();
  for (const [node, list] of byNode) {
    list.sort((x, y) => y.start - x.start); // 後ろから包むと前の位置がずれない
    for (const c of list) {
      const mid = node.splitText(c.start);
      mid.splitText(c.end - c.start);
      const a = document.createElement('a');
      a.setAttribute('href', '#' + c.targetId);
      mid.replaceWith(a);
      a.appendChild(mid);
      hosts.add(c.hostId);
    }
  }
  for (const id of hosts) {
    const art = A.get(id);
    const html = roots.get(id).innerHTML;
    art.body = html;
    touch(id);
    if (S.edit && id === S.cur) {
      // 編集中の記事は、元に戻す（Ctrl+Z）で取り消せるように履歴に積んで差し替える
      edit(() => { ed.innerHTML = html; hydrate(ed); markBrokenLinks(ed); });
      baseline = serializeBody();
    }
  }
  if (!S.edit && hosts.has(S.cur)) renderArticle();
  renderMeta();
  return hosts.size;
}

// 候補を選ぶ画面。done(added) は閉じたあとに呼ばれる
function showLinkSuggestions(ids, { done, emptyToast = false } = {}) {
  const { cands, roots } = collectLinkCandidates(ids);
  if (!cands.length) {
    if (emptyToast) toast('リンクできそうな言葉は見つかりませんでした');
    done && done(0);
    return;
  }
  const box = document.createElement('div');
  const titleOf = (id) => esc(A.get(id).title || '無題の記事');
  const row = (c, i) => `<label class="lk-row ${c.on ? 'on' : ''}" data-i="${i}">
      <input type="checkbox" ${c.on ? 'checked' : ''}>
      <div class="lk-main">
        <div class="lk-snip">${c.snippet}</div>
        <div class="lk-to">${c.dir === 'in' ? `記事「${titleOf(c.hostId)}」の中 ・ ` : ''}${ic('link', 'xs')}<b>${titleOf(c.targetId)}</b> へリンク
          <span class="lk-kind">${c.term.kind === 'title' ? 'タイトルと一致' : '見出し「' + esc(c.term.text) + '」と一致'}</span></div>
      </div></label>`;
  const outs = cands.map((c, i) => [c, i]).filter(([c]) => c.dir === 'out');
  const ins = cands.map((c, i) => [c, i]).filter(([c]) => c.dir === 'in');
  const one = ids.length === 1 ? `「${titleOf(ids[0])}」` : '書いた記事';
  box.innerHTML = `<p>ほかの記事のタイトルや見出しと同じ言葉が見つかりました。リンクにしたいものにチェックを入れてください。リンクにすると、クリックでその記事へ移動できます。</p>
    <div class="lk-tools"><button class="btn ghost" data-all="1">${ic('check', 'sm')}すべて選ぶ</button><button class="btn ghost" data-all="0">${ic('x', 'sm')}すべて外す</button></div>
    ${outs.length ? `<h4 class="lk-h">${one}の中の言葉 → ほかの記事へ <span>${outs.length}件</span></h4>${outs.map(([c, i]) => row(c, i)).join('')}` : ''}
    ${ins.length ? `<h4 class="lk-h">ほかの記事の中の言葉 → ${one}へ <span>${ins.length}件</span></h4>${ins.map(([c, i]) => row(c, i)).join('')}` : ''}`;
  let modal;
  const refresh = () => {
    $$('.lk-row', box).forEach((el) => { const c = cands[+el.dataset.i]; c.on = el.querySelector('input').checked; el.classList.toggle('on', c.on); });
    const n = cands.filter((c) => c.on).length;
    const b = modal.actions[1].el;
    b.disabled = !n;
    b.textContent = n ? `選んだ${n}件をリンクする` : 'リンクする候補を選んでください';
  };
  box.addEventListener('change', refresh);
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-all]');
    if (!b) return;
    $$('.lk-row input', box).forEach((x) => { x.checked = b.dataset.all === '1'; });
    refresh();
  });
  let finished = false;
  const finish = (n) => { if (finished) return; finished = true; done && done(n); };
  modal = openModal({
    title: 'リンクの候補', icon: 'link', wide: true, body: box,
    actions: [
      { label: 'リンクしない', onClick: () => finish(0) },
      {
        label: 'リンクする', primary: true, onClick: () => {
          const chosen = cands.filter((c) => c.on);
          const n = applyLinkCandidates(chosen, roots);
          toast(`${chosen.length}件のリンクを追加しました（${n}記事・未保存）`, 'ok');
          finish(chosen.length);
        },
      },
    ],
  });
  // Esc や背景クリックで閉じたときも続きの処理を進める
  const obs = new MutationObserver(() => { if (!document.body.contains(box)) { obs.disconnect(); finish(0); } });
  obs.observe(document.body, { childList: true });
  refresh();
}

// ---------- export / import ----------
function exportArticles(id, withChildren) {
  commitEditor();
  const root = A.get(id);
  if (!root) return;
  const list = [root, ...(withChildren ? descendants(id) : [])];
  const t = nowISO(), me = userName() || '名前未設定';
  const articles = list.map((a) => {
    const c = cleanArticle(a);
    if (S.touched.has(a.id)) { c.updatedAt = t; c.updatedBy = me; c.rev = (c.rev || 0) + 1; }
    return c;
  });
  const images = {};
  for (const k of referencedImages(list)) if (IMG[k]) images[k] = IMG[k];
  const data = { format: 'quine-articles', version: 1, exportedAt: t, from: db.meta.name, rootId: id, articles, images };
  download(JSON.stringify(data, null, 1), safeFileName(root.title || '記事') + '.json', 'application/json');
  toast(`${list.length}件の記事をエクスポートしました`, 'ok');
}

function needEditForImport() {
  openModal({
    title: 'インポートは編集モードで行います', icon: 'import', tone: 'edit',
    body: '<p>取り込みの前に、ファイルの最新版を読み込み直して編集モードに入ります。<br>編集モードになったら、もう一度インポートしてください。</p>',
    actions: [{ label: 'キャンセル' }, { label: '編集モードに入る', primary: true, tone: 'edit', onClick: () => { requestEdit(); } }],
  });
}

function startImport() {
  if (!S.edit) { needEditForImport(); return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => inp.files[0] && importFile(inp.files[0]);
  inp.click();
}

async function importFile(file) {
  if (!S.edit) { needEditForImport(); return; }
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { toast('JSONファイルとして読み込めませんでした', 'warn'); return; }
  if (!d || d.format !== 'quine-articles' || !Array.isArray(d.articles)) { toast('QUINEでエクスポートした記事ファイルではありません', 'warn', 4500); return; }
  commitEditor();
  showImport(d, file.name);
}

function showImport(d, fname) {
  const images = d.images || {};
  const items = d.articles.filter((a) => a && a.id).map((a) => ({
    id: String(a.id), parentId: a.parentId ?? null, title: String(a.title || ''),
    body: sanitizeHTML(String(a.body || ''), { images }),
    createdAt: a.createdAt || nowISO(), updatedAt: a.updatedAt || nowISO(), updatedBy: a.updatedBy || '不明', rev: a.rev || 0,
  }));
  const dups = items.filter((it) => A.has(it.id));
  const choice = new Map();
  const box = document.createElement('div');
  const parentLabel = (it) => {
    if (it.parentId && items.some((x) => x.id === it.parentId)) return '取り込む記事の下';
    if (it.parentId && A.has(it.parentId)) return '「' + (A.get(it.parentId).title || '無題') + '」の下';
    return 'ルート直下';
  };
  box.innerHTML = `<div class="imp-summary"><span class="chip">${ic('file', 'xs')}${esc(fname)}</span><span class="chip new">新規 ${items.length - dups.length}件</span>${dups.length ? `<span class="chip dup">同じ記事あり ${dups.length}件</span>` : ''}</div>
    ${dups.length ? '<p>すでにこのWikiにある記事は、<b>左右を見比べて</b>どうするかを選んでください。</p>' : '<p>次の記事を取り込みます。</p>'}
    ${dups.length > 1 ? `<div class="imp-choice" style="border:0;background:none;padding:0 0 12px"><span class="q">まとめて：</span><button class="opt" data-all="replace">すべて置き換える</button><button class="opt" data-all="copy">すべて別記事として追加</button><button class="opt skip" data-all="skip">すべてやめる</button></div>` : ''}
    <div class="imp-list"></div>`;
  const list = box.querySelector('.imp-list');
  for (const it of items) {
    const ex = A.get(it.id);
    if (!ex) {
      list.insertAdjacentHTML('beforeend', `<div class="imp-item"><div class="imp-row"><span class="chip new">新規</span><span class="t">${esc(it.title || '無題の記事')}</span><span class="d">追加先：${esc(parentLabel(it))}</span></div></div>`);
      continue;
    }
    const newer = (a, b) => String(a) > String(b);
    const el = h(`<div class="imp-item dup" data-id="${esc(it.id)}">
      <div class="imp-row"><span class="chip dup">同じ記事あり</span><span class="t">${esc(it.title || '無題の記事')}</span></div>
      <div class="imp-cmp">
        <div class="imp-side"><h4>いまのWiki</h4><div class="who">最終更新：<b>${esc(ex.updatedBy || '不明')}</b> さん　${esc(fmtDate(ex.updatedAt, true))}${newer(ex.updatedAt, it.updatedAt) ? '<span class="newer">こちらが新しい</span>' : ''}</div>
          <div class="prose imp-prev cur"><div class="qtitle"></div><div class="b"></div></div></div>
        <div class="imp-side"><h4>取り込むファイル</h4><div class="who">最終更新：<b>${esc(it.updatedBy)}</b> さん　${esc(fmtDate(it.updatedAt, true))}${newer(it.updatedAt, ex.updatedAt) ? '<span class="newer">こちらが新しい</span>' : ''}</div>
          <div class="prose imp-prev inc"><div class="qtitle"></div><div class="b"></div></div></div>
      </div>
      <div class="imp-choice"><span class="q">どうしますか？</span>
        <button class="opt" data-c="replace">${ic('check', 'xs')}置き換える</button>
        <button class="opt" data-c="copy">${ic('plus', 'xs')}別記事として追加</button>
        <button class="opt skip" data-c="skip">${ic('x', 'xs')}やめる</button>
      </div></div>`);
    el.querySelector('.cur .qtitle').textContent = ex.title || '無題の記事';
    el.querySelector('.cur .b').innerHTML = ex.body;
    el.querySelector('.inc .qtitle').textContent = it.title || '無題の記事';
    el.querySelector('.inc .b').innerHTML = it.body;
    for (const img of $$('.cur img[data-img]', el)) img.src = imgURL(img.dataset.img, IMG);
    for (const img of $$('.inc img[data-img]', el)) img.src = imgURL(img.dataset.img, IMG[img.dataset.img] ? IMG : images);
    list.appendChild(el);
  }
  let modal;
  const refresh = () => {
    $$('.imp-item.dup', box).forEach((el) => $$('.opt', el).forEach((b) => b.classList.toggle('on', choice.get(el.dataset.id) === b.dataset.c)));
    const undecided = dups.filter((it) => !choice.has(it.id)).length;
    const n = items.length - dups.length + dups.filter((it) => ['replace', 'copy'].includes(choice.get(it.id))).length;
    const btn = modal.actions[1].el;
    btn.disabled = undecided > 0 || n === 0;
    btn.textContent = undecided ? `あと${undecided}件を選んでください` : `${n}件を取り込む`;
  };
  box.addEventListener('click', (e) => {
    const all = e.target.closest('[data-all]');
    if (all) { dups.forEach((it) => choice.set(it.id, all.dataset.all)); refresh(); return; }
    const b = e.target.closest('.opt[data-c]');
    if (!b) return;
    choice.set(b.closest('.imp-item').dataset.id, b.dataset.c);
    refresh();
  });
  modal = openModal({
    title: '記事のインポート', icon: 'import', wide: dups.length > 0, body: box,
    actions: [
      { label: 'キャンセル' },
      { label: '取り込む', primary: true, onClick: () => { applyImport(items, choice, images); } },
    ],
  });
  refresh();
}

function applyImport(items, choice, images) {
  const idMap = new Map();
  for (const it of items) {
    const c = A.has(it.id) ? choice.get(it.id) : 'new';
    if (c === 'skip') continue;
    idMap.set(it.id, c === 'copy' ? uuid() : it.id);
  }
  let added = 0, replaced = 0;
  for (const it of items) {
    const c = A.has(it.id) && !idMap.has(it.id) ? 'skip' : (A.has(it.id) ? choice.get(it.id) : 'new');
    if (c === 'skip') continue;
    if (c === 'replace') {
      const ex = A.get(it.id);
      Object.assign(ex, { title: it.title, body: it.body, updatedAt: it.updatedAt, updatedBy: it.updatedBy, rev: Math.max(ex.rev || 0, it.rev || 0) });
      replaced++;
      continue;
    }
    const nid = idMap.get(it.id);
    let pid = null;
    if (it.parentId && idMap.has(it.parentId)) pid = idMap.get(it.parentId);
    else if (it.parentId && A.has(it.parentId)) pid = it.parentId;
    const order = childrenOf(pid).length;
    A.set(nid, { ...it, id: nid, parentId: pid, order, title: c === 'copy' ? (it.title || '無題の記事') + '（インポート）' : it.title });
    if (pid) S.expanded.add(pid);
    added++;
  }
  for (const k of referencedImages(items)) if (!IMG[k] && images[k]) IMG[k] = images[k];
  saveExpanded();
  setDirty(true);
  const first = items.find((it) => idMap.has(it.id));
  if (first && A.has(idMap.get(first.id))) { S.cur = null; go(idMap.get(first.id)); } else renderAll();
  toast(`${added ? `${added}件を追加` : ''}${added && replaced ? '、' : ''}${replaced ? `${replaced}件を置き換え` : ''}しました。保存するとファイルに反映されます`, 'ok', 5500);
}

      記事 <b>${A.size}</b> 件 ・ 画像 <b>${used}</b> 枚 ・ アプリ v${APP_VERSION}（データ形式 v${DATA_VERSION}）${db.meta.savedAt ? `<br>最終保存：${esc(fmtDate(db.meta.savedAt, true))}` : ''}</div>
      <p style="font-size:11.5px;color:var(--faint);margin:12px 0 0;text-align:left">アイコンは Lucide（ISC License, © Lucide Icons and Contributors。一部は Feather 由来で MIT License, © Cole Bemis）を参考にしています。画像の重複判定は cyrb53（© bryc, Public domain）を元にしています。ライセンス文の全文はこのファイルの先頭に記載しています。</p></div>`,
    actions: [{ label: '閉じる', primary: true }],
  });
}

function openMainMenu(btn) {
  let size = 0;
  try { size = new Blob([buildHTML(dataObject())]).size; } catch (e) { size = 0; }
  openMenu([
    { label: 'インポート…', icon: 'import', hint: S.edit ? '' : '編集モード', onClick: startImport },
    { label: '新規Wiki開設…', icon: 'book', onClick: newWikiDialog },
    '-',
    { label: '設定…', icon: 'settings', onClick: settingsDialog },
    { label: 'このツールについて', icon: 'info', onClick: aboutDialog },
    '-',
    { html: `<div class="mfoot">${ic('db', 'sm')}<span>ファイルサイズ</span><b style="margin-left:auto">${fmtSize(size)}</b></div>` },
  ], btn);
}

// ---- main.js ----
// ---------- navigation ----------
function go(id) {
  if (!A.has(id)) return;
  const cur = decodeURIComponent(location.hash.slice(1));
  if (cur !== id) { location.hash = id; return; } // hashchange → show
  show(id);
}
function show(id) {
  commitEditor();
  S.cur = id;
  revealInTree(id);
  renderTree();
  renderArticle();
  $('.content').scrollTop = 0;
}

function bindGlobal() {
  addEventListener('hashchange', () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (A.has(id) && id !== S.cur) show(id);
  });

  addEventListener('beforeunload', (e) => {
    if (S.edit) commitEditor();
    if (!S.dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });

  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod && k === 's') { e.preventDefault(); save(); return; }
    if (mod && k === 'f' && !e.shiftKey) { e.preventDefault(); const q = $('#q'); q.focus(); q.select(); return; }
    if (e.key === 'F3') { e.preventDefault(); hitStep(e.shiftKey ? -1 : 1); return; }
    if (e.key === 'Escape') {
      if (floating) { closeFloating(); return; }
      if (S.search.terms.length && !S.edit && document.activeElement === document.body) clearSearch();
    }
  });

  $('.save-btn').addEventListener('click', save);
  $('#mainMenu').addEventListener('click', (e) => openMainMenu(e.currentTarget));
  $('#docMenu').addEventListener('click', (e) => { if (S.cur) openMenu(articleMenuItems(S.cur), e.currentTarget); });
  $('.edit-btn').addEventListener('click', () => (S.edit ? exitEdit() : requestEdit()));
  $('.brand').addEventListener('click', () => { const f = childrenOf(null)[0]; if (f) go(f.id); });
  $('.content').addEventListener('scroll', () => { if (floating && !floating.el.classList.contains('pop')) closeFloating(); }, { passive: true });

  // JSONファイルのドラッグ＆ドロップでインポート
  const dz = $('.dropzone');
  const jsonDrag = (e) => {
    const it = Array.from((e.dataTransfer && e.dataTransfer.items) || []);
    return it.length > 0 && it.some((i) => i.kind === 'file' && !i.type.startsWith('image/'));
  };
  addEventListener('dragover', (e) => {
    if (!jsonDrag(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    dz.classList.add('on');
  });
  addEventListener('dragleave', (e) => { if (!e.relatedTarget || e.clientX <= 0 || e.clientY <= 0) dz.classList.remove('on'); });
  addEventListener('drop', (e) => {
    dz.classList.remove('on');
    const f = Array.from((e.dataTransfer && e.dataTransfer.files) || []).find((x) => /\.json$/i.test(x.name) || x.type === 'application/json');
    if (!f) { if (e.dataTransfer && e.dataTransfer.files.length) e.preventDefault(); return; }
    e.preventDefault();
    importFile(f);
  });
}

// ---------- boot ----------
function boot() {
  loadData();
  buildShell();
  buildToolbar();
  bindEditor();
  bindTable();
  bindImages();
  bindSearch();
  bindTree();
  bindGlobal();
  loadExpanded();

  const intent = takeIntent();
  let id = decodeURIComponent(location.hash.slice(1));
  if (intent && intent.id) id = intent.id;
  if (!A.has(id)) id = childrenOf(null)[0] ? childrenOf(null)[0].id : null;
  S.cur = id;
  if (id) {
    revealInTree(id);
    if (decodeURIComponent(location.hash.slice(1)) !== id) history.replaceState(null, '', '#' + id);
  }
  if (intent) { S.edit = true; document.body.classList.add('editing'); }
  renderAll();
  if (intent) {
    if (intent.top) $('.content').scrollTop = intent.top;
    if (intent.id && !A.has(intent.id)) toast('編集しようとした記事は、最新版のファイルでは削除されていました', 'warn', 6000);
    else toast('ファイルの最新版を読み込みました。編集できます', 'ok');
  }
  if ((db.meta.version || 1) > DATA_VERSION) toast('このファイルは新しい版のQUINEで作られています。一部が正しく表示されない可能性があります', 'warn', 8000);
}

boot();

})();
</script>
